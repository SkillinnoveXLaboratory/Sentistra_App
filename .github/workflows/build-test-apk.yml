name: Build Signed Release AAB

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-aab:
    name: Android release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Android project
        env:
          CI: "1"
          NODE_ENV: production
        run: npx expo prebuild --platform android --no-install

      # R8 + resource shrinking exceed Expo's default 2 GB Gradle heap
      # ("Java heap space" in packageReleaseBundle). Runners have 16 GB of RAM.
      - name: Raise Gradle memory
        run: |
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          # The generated file has no trailing newline; start a new line so the setting is not
          # glued onto the previous property.
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\n' >> android/gradle.properties
          grep "^org.gradle.jvmargs=-Xmx6g" android/gradle.properties

      - name: Verify generated launcher icon inputs
        run: |
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.webp

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sentistra-release.jks"
          test -s "$RUNNER_TEMP/sentistra-release.jks"

      - name: Build signed release AAB
        working-directory: android
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/sentistra-release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify AAB signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose:summary -certs "$AAB" | tail -n 5
          jarsigner -verify "$AAB" | grep -q "jar verified"

      # The AAB is the file Google Play needs for a release.
      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Sentistra-v1.0.9-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # R8 obfuscates release code; this file turns crash stack traces back into readable names.
      # The AAB already carries it for Google Play, so this copy is only for manual lookups.
      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: Sentistra-v1.0.9-r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sentistra-release.jks"
